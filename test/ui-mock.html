<style>
  /* mock-only: placeholder court, frozen animation frames for screenshots, and the contact sheet */
  #stage svg{width:100%;height:100%;display:block}
  .freeze *, .freeze *::before, .freeze *::after{animation-play-state:paused!important;animation-delay:var(--freeze-at,-700ms)!important}
  .freeze .callout{--freeze-at:-600ms} .freeze .light{--freeze-at:0ms} .freeze .medal{--freeze-at:-1200ms} .freeze .medal-disc::after{--freeze-at:-1150ms}
  .freeze .game-slam{--freeze-at:-330ms} .freeze .result-slam.is-rank{--freeze-at:-230ms} .freeze .trophy-em .medal-rays{--freeze-at:-400ms}      /* the GAME stamp on its way out (the card under it readable), RANK UP! mid-slam, the rank-up's rays open */
  .freeze .tally-num,.freeze .tally-num::before,.freeze .trophy-n,.freeze .trophy-n::before{--freeze-at:-2200ms}      /* the counts landed: the numbers read in a still frame */
  .freeze .result-flash.is-sweep{--freeze-at:-995ms} .freeze .vs-card.is-ranked::after{--freeze-at:-1300ms}      /* the rank-up and MATCH FOUND light sweeps have passed: no bright band across the names in a still (NOTES 117) */
  #stage.bg-court svg,#stage.bg-grass svg,#stage.bg-stadium svg{display:none} #stage.bg-court{background:#3569b8} #stage.bg-grass{background:#4b9a66} #stage.bg-stadium{background:radial-gradient(ellipse at 50% 70%,#1d3d73 0,#0f1a2c 55%,#0b1116 100%)}      /* &bg=court|grass|stadium: the grounds the white key hints must read on (stadium: the Ranked night court) */
  .fake-cam{aspect-ratio:16/9;background:radial-gradient(circle at 50% 38%,#f1c9a5 0 9%,transparent 9.5%),radial-gradient(ellipse 22% 34% at 50% 92%,#4f7fb3 0 98%,transparent 100%),linear-gradient(180deg,#cfd8de,#aab6bf)}
  .fake-pod{aspect-ratio:1;display:grid;place-items:center} .fake-pod svg{width:62%}
  body.sheet{overflow:auto;height:auto;background:#e8f1f6}
  html.sheet-root{overflow:auto;height:auto;font-size:16px}
  #sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:24px}
  #sheet figure{margin:0} #sheet figcaption{font:800 13px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px 4px}
  #sheet .thumb{position:relative;width:100%;aspect-ratio:1440/900;overflow:hidden;border-radius:12px;box-shadow:var(--sh-2);background:#fff}
  #sheet iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}
</style>

    'settings', 'settings-paused', 'settings-stats', 'settings-watch', 'hud-paused', 'hold', 'watch', 'watch-split', 'watch-pov', 'watch-point', 'match-win', 'match-voted', 'match-asked', 'match-left', 'match-lose', 'match-forfeit', 'match-watch', 'match-legacy', 'match-nostats', 'server-down', 'game-full', 'hud-ask', 'hud-ask-settings', 'match-ask', 'watch-ask',

    'rk-vs', 'rk-game', 'match-rk-win', 'match-rk-lose', 'match-rk-forfeit', 'match-rk-matt', 'ranked-hud-pressure',
    'rk-search'];      // OPTIONAL WARM-UP: the search bar while queued off court (&over=ranked|home|courts|title, &busy=1: Warm up with Matt pressed, the answer still out)      // the match show (8.3-8.10): MATCH FOUND (&friendly=1&ready=1), the GAME card (&beat=lose&deciding=1&watch=1&next=6), the series card (&trophy=up|down|zero|none|void|unsaved|rankup|divup|rankdown|walkover, &rankup=1 = the ceremony's frame), the warm-up card (&trophy=matt|mattcap), game / match point (&kind=match)
  // extra params: &bg=court|grass (flat ground under the HUD) · &name=<player name> · &opp=<opponent> (try a hostile one) · &idle=1 · &freeze=1

  if (screen === 'all') {
    document.documentElement.classList.add('sheet-root'); document.body.classList.add('sheet'); const sheet = $('sheet'); sheet.hidden = false;

    const fit = () => document.querySelectorAll('#sheet .thumb').forEach(t => t.firstChild.style.transform = `scale(${t.clientWidth / 1440})`); fit(); addEventListener('resize', fit);
  } else {
    const html = await (await fetch('../web/index.html')).text();
    $('ui-root').innerHTML = html.slice(html.indexOf('<!-- UI:BEGIN -->'), html.indexOf('<!-- UI:END -->'));
    // stand-ins for the two live canvases
    $('camc').outerHTML = '<div class="inset-fill fake-cam"></div>'; $('camwrap').hidden = false;
    $('pod').outerHTML = '<div class="inset-fill fake-pod"><svg viewBox="0 0 100 160"><rect x="40" y="52" width="20" height="98" rx="10" fill="#f4f6f8" stroke="#c4ced6" stroke-width="3"/><ellipse cx="46" cy="38" rx="30" ry="32" fill="#fbfcfd" stroke="#c4ced6" stroke-width="3"/><circle cx="34" cy="34" r="7" fill="#59636c"/></svg></div>';
    const me = screen === 'lobby-first' ? '' : qs.get('name') ?? 'Daniel', opp = qs.get('opp') || 'Matt';
    try { if (me) localStorage.setItem('poddle.name', me); else localStorage.removeItem('poddle.name'); } catch { /* fine */ }      // ui.js reads it as it loads
    const ui = await import('../web/ui.js'); window.__ui = ui;
    if (qs.get('bg')) $('stage').classList.add('bg-' + qs.get('bg')); if (qs.get('bg') === 'stadium') document.body.dataset.venue = 'stadium';      // the tint web/scene.js setVenue sets
    const hud = (a = 7, b = 5, rally = 4) => { $('stage').hidden = false; ui.showScreen(null); ui.setStatus({ airpod: 'ok', game: 'ok', camera: 'ok' }); ui.setRoom('K24M', 'https://poddleball.com/?court=K24M'); ui.setNames({ them: opp, themSub: opp === 'Matt' ? 'Club' : 'Far side' }); ui.setBot(opp === 'Matt' ? 'Club' : null); ui.setScore(a, b); ui.setServe('me'); ui.setRally(rally); ui.setSettings({ sens: 8, airpod: true, stats: false, inRoom: true }); };
    const watch = (view = 'broadcast', who = '') => { hud(6, 4, 7); $('camwrap').hidden = true; ui.setNames({ me: me || 'Player 1', meSub: '', them: opp, themSub: '' }); ui.setSpectator(true); ui.setWatchers(3); ui.setSettings({ spectator: true }); ui.setView(view, who); };
    // the court list: open courts (a join seats you), ask rows (one human playing Matt: a join asks them), full courts (the row is Watch). &tour=1 adds a tournament signing up
    const ROOMS = [{ code: 'KXQ7', players: 1, open: true, ask: false, bot: false, watch: 8, watchers: 0, score: [0, 0], live: false, names: ['Dan', null] },
      { code: 'M3PD', players: 2, open: false, ask: false, bot: false, watch: 6, watchers: 2, score: [7, 4], live: true, names: ['Ann', 'Ben'] },
      { code: 'RN2S', players: 2, open: false, ask: false, bot: false, watch: 0, watchers: 8, score: [10, 9], live: true, names: ['Priyanka', 'Sam'] },
      { code: 'WXYZ', players: 1, open: true, ask: false, bot: true, watch: 8, watchers: 1, score: [0, 0], live: false, names: ['Kim', 'Matt'] },
      { code: 'KXQ9', players: 1, open: false, ask: true, bot: true, watch: 7, watchers: 1, score: [4, 6], live: true, names: ['Lu', 'Matt'] },
      { code: 'H4TT', players: 1, open: true, ask: false, bot: false, watch: 8, watchers: 0, score: [0, 0], live: false, names: ['Oliver', null] },
      { code: 'B7QE', players: 1, open: true, ask: false, bot: false, watch: 8, watchers: 3, score: [0, 0], live: false, names: ['Mei', null] },
      { code: 'Z9KP', players: 1, open: false, ask: true, bot: true, watch: 8, watchers: 0, score: [2, 1], live: true, names: ['Rafael', 'Matt'] },
      { code: 'CQ3N', players: 2, open: false, ask: false, bot: false, watch: 8, watchers: 0, score: [0, 0], live: false, names: ['Jo', 'Tia'] },
      { code: 'EV5R', players: 1, open: true, ask: false, bot: false, watch: 8, watchers: 0, score: [0, 0], live: false, names: ['Noor', null] },
      { code: 'GJ2W', players: 1, open: true, ask: false, bot: true, watch: 8, watchers: 0, score: [0, 0], live: false, names: ['Ivy', 'Matt'] }];
    const TOURS = qs.get('tour') === '1' ? [{ code: 'T8MX', host: 'Daniel', n: 5, max: 16 }] : [];      // (tourney-courts adds it too)
    const lobby = (view = 'home', rooms = ROOMS) => { $('stage').hidden = false; ui.showScreen('lobby'); ui.lobbyView(view); if (rooms) ui.lobbyRooms(rooms, 5, TOURS); };
    // Ranked: the five tiles show where the server keeps stats (web/profile.js unhides them and calls tilesFit); the view draws from a ladder like /api/stats sends
    const TIER = Math.min(7, Math.max(1, +qs.get('tier') || 2)), TROPH = qs.get('t') != null ? +qs.get('t') : [40, 240, 372, 500, 660, 800, 1050][TIER - 1], QN = +qs.get('q') || 0, DIV = +qs.get('div') || 0;      // &div= overrides the division the count implies
    const five = () => { for (const id of ['btn-profile', 'btn-ranked']) $(id).hidden = false; ui.tilesFit(); ui.rkTile({ tier: qs.get('new') ? null : TIER, div: DIV, trophies: TROPH, queued: QN }); };
    const rkLobby = () => { $('stage').hidden = false; document.body.dataset.venue = 'stadium'; ui.showScreen('lobby'); five(); ui.lobbyView('ranked');
      ui.rkView(qs.get('new') ? null : { tier: TIER, div: DIV, trophies: TROPH, best: Math.max(TIER, +qs.get('best') || 0), bestAt: Date.UTC(2026, 9, 2), wins: 3, losses: 1, queued: QN, note: qs.get('note') || '' }); };
    const rkHud = (a = 3, b = 2, rally = 0, games = [1, 0]) => { hud(a, b, rally); document.body.dataset.venue = 'stadium'; ui.setBot(null); ui.setNames({ me: 'You', meSub: 'Near side', them: opp === 'Matt' ? 'Priyanka' : opp, themSub: 'Far side', reg: [false, true], rank: [{ tier: TIER, div: 2 }, { tier: Math.min(7, TIER + 1), div: 1 }] }); ui.rkCourt('match'); ui.setSettings({ canPause: false, rkMatch: true, forfeit: true }); ui.setSeries({ bestOf: 3, games }); };
    // the match show (docs/RANKED.md 8.3-8.10): rkres messages as the server sends them, the series card from my side, the game card
    const RKN = opp === 'Matt' ? 'Priyanka' : opp, RKR = [{ tier: TIER, div: 2 }, { tier: Math.min(7, TIER + 1), div: 1 }];
    const rkRes = o => ({ saved: true, won: true, delta: 33, trophies: 273, tier: 2, div: 3, tierWas: 2, divWas: 2, floorHeld: false, counted: true, why: [], games: [2, 1], scores: [[7, 4], [5, 7], [7, 3]], ...o });
    const TROPHY = { up: rkRes({}), down: rkRes({ won: false, delta: -20, trophies: 220, div: 2 }), zero: rkRes({ won: false, delta: 0, trophies: 150, div: 1, divWas: 1, floorHeld: true }), none: rkRes({ won: false, counted: false, delta: 0, trophies: 240, why: ['left_early'] }),
      void: rkRes({ void: true, saved: false, counted: false, delta: 0, trophies: 240, why: ['noshow'] }), unsaved: rkRes({ saved: false, delta: 0, trophies: 240 }), rankup: rkRes({ delta: 33, trophies: 312, tier: 3, div: 1, tierWas: 2, divWas: 3 }), divup: rkRes({ delta: 33, trophies: 262, div: 3, divWas: 2 }),
      rankdown: rkRes({ won: false, delta: -26, trophies: 590, tier: 4, div: 3, tierWas: 5, divWas: 1 }), walkover: rkRes({ delta: 30, trophies: 270, forfeit: true, games: [1, 0], scores: [[7, 4]] }), matt: rkRes({ matt: true, delta: 8, trophies: 248, div: 2, dayLeft: 24, games: undefined, scores: undefined }), mattcap: rkRes({ matt: true, delta: 0, trophies: 248, div: 2, dayLeft: 0, games: undefined, scores: undefined }) };
    const rkCard = (o, tr) => { rkHud(o.me, o.them, 0, o.rk.games); ui.setServe(null); ui.setSeries({ bestOf: 3, games: o.rk.games, done: true }); ui.matchResult({ nameThem: RKN, reg: [false, true], rank: RKR, ...o }); const t = qs.get('trophy') || tr; if (t && TROPHY[t]) ui.trophyRow(TROPHY[t]); if (qs.get('rankup') === '1') ui.rankUp({ tier: 3, div: 1, kind: 'rank' }); };
    const courts = (rooms = ROOMS) => { lobby('courts', rooms); if (qs.get('q')) { const i = $('court-search'); i.value = qs.get('q'); i.dispatchEvent(new Event('input')); } };
    const tab = f => $('court-seg').querySelector(`[data-filter="${f}"]`).click();
    const tab0 = () => { try { localStorage.removeItem('poddle.courts'); } catch { /* fine */ } };
    const result = (o, votes) => { hud(o.me, o.them, 0); ui.setServe(null); ui.matchResult({ nameThem: opp, ...o }); if (votes) ui.rematch({ name: opp, ...votes }); };
    const cal = (e, o) => { ui.setStatus({ airpod: 'ok', game: 'ok', camera: 'ok' }); ui.showScreen('calibrate'); ui.calibration(e, o); };
    // tournaments (docs/COURTS-TOURNEY.md 4.6): a snapshot as the server sends it. &n= players, &you=through|out|watching, &next=1 (the break between rounds), &why= (ended)
    const TN = ['Daniel', 'Kim', 'Ben', 'Sam', 'Ana', 'Priyanka', 'Lu', 'Oliver', 'Mei', 'Rafael', 'Noor', 'Ivy', 'Jo', 'Tia', 'Ada', 'Bo'], LINK = 'https://poddleball.com/?court=K24M';
    const tsnap = (n, o = {}) => ({ type: 'tour', code: 'K24M', phase: 'reg', min: 4, max: 16, n, host: 'Daniel', win: 7, final: 11, rounds: [], next: null, champ: null, ...o,
      you: { id: 1, host: true, out: false, viewer: false, warm: 'off', ...o.you }, players: TN.slice(0, n).map((name, i) => ({ id: i + 1, name, host: i === 0, out: false, left: false, on: i !== o.off })) });
    const P = i => ({ id: i + 1, name: TN[i], bot: false }), M = { id: null, name: 'Matt', bot: true }, TBD = { id: null, name: null, bot: false };
    const mt = (n, a, b, o = {}) => ({ n, a, b, room: null, score: [0, 0], live: false, w: null, forfeit: false, watchers: 0, ...o });
    const tbd = k => Array.from({ length: k }, (_, i) => mt(i + 1, TBD, TBD));
    function bracketSnap(n, you, next) {      // 5 players: Round 1 (3, one Matt), Semifinal, Final. 16: Round 1, Quarterfinal, Semifinal, Final
      const r1 = n === 5 ? [mt(1, P(0), P(1), { w: 'a', score: [7, 4] }), next ? mt(2, P(2), P(3), { w: 'b', score: [9, 11], forfeit: false }) : mt(2, P(2), P(3), { live: true, room: 'QW7R', score: [5, 3], watchers: 2 }), mt(3, P(4), M, { w: 'b', score: [5, 7] })]
        : Array.from({ length: 8 }, (_, i) => i === 6 && !next ? mt(7, P(12), P(13), { live: true, room: 'QW7R', score: [4, 6], watchers: 3 }) : i === 7 && !next ? mt(8, P(14), P(15), { live: true, room: 'HN3D', score: [2, 2] }) : mt(i + 1, P(i * 2), P(i * 2 + 1), { w: i % 3 === 1 ? 'b' : 'a', score: i % 3 === 1 ? [3, 7] : i === 4 ? [7, 0] : [7, 5], forfeit: i === 4 }));
      const rounds = n === 5 ? [{ name: 'Round 1', target: 7, matches: r1 }, { name: 'Semifinal', target: 7, matches: tbd(2) }, { name: 'Final', target: 11, matches: tbd(1) }]
        : [{ name: 'Round 1', target: 7, matches: r1 }, { name: 'Quarterfinal', target: 7, matches: tbd(4) }, { name: 'Semifinal', target: 7, matches: tbd(2) }, { name: 'Final', target: 11, matches: tbd(1) }];

      return tsnap(n, { phase: 'play', rounds, next: next ? { what: 'round', in: 6 } : null, you: { id: yid, host: yid === 1, out: you === 'out', viewer: you === 'watching', warm: 'off' } });
    }
    const CHAMP = { id: 1, name: 'Daniel', bot: false, path: [{ round: 'Round 1', vs: 'Kim', bot: false, score: [7, 4], forfeit: false }, { round: 'Semifinal', vs: 'Matt', bot: true, score: [7, 5], forfeit: false }, { round: 'Final', vs: 'Priyanka', bot: false, score: [11, 9], forfeit: false }] };

    const R = {
      'title': () => { $('stage').hidden = false; ui.showScreen('title'); },
      'lobby': () => lobby(), 'lobby-first': () => lobby(), 'lobby-bot': () => lobby('bot'),
      'lobby-ask': () => { lobby(); ui.askWatch('M3PD'); },
      'lobby-courts': () => { courts(); tab('open'); },
      'lobby-courts-full': () => { courts(); tab('full'); },
      'lobby-courts-loading': () => { tab0(); lobby('courts', null); },
      'lobby-courts-empty': () => { courts([ROOMS[1], ROOMS[2]]); tab('open'); },
      'lobby-courts-empty-full': () => { courts(ROOMS.filter(r => r.open !== false || r.ask)); tab('full'); },      // nothing to watch: the Full tab's own empty line
      'lobby-courts-nomatch': () => { if (!qs.get('q')) qs.set('q', 'ZZ'); courts([...ROOMS, { code: 'ZZ4Q', players: 2, open: false, ask: false, bot: false, watch: 8, watchers: 0, score: [3, 5], live: true, names: ['Ada', 'Bo'] }]); tab('open'); },      // one Full court matches ZZ: the '1 in Full' switch shows
      'lobby-courts-down': () => { courts(); tab('open'); ui.lobbyLink(false); },
      'lobby-courts-err': () => { courts(); tab('open'); ui.lobbyView('courts', { code: 'QQ4R' }); ui.codeError('Court not found'); },
      'lobby-courts-link': () => { courts(); tab('open'); ui.lobbyView('courts', { code: 'M3PD', watch: true }); },
      'lobby-courts-many': () => { courts([...Array(42)].map((_, i) => ({ code: 'CDEFGHJKMN'[i % 10] + 'PQRSTUVWXY'[(i / 10) | 0] + '2' + '3456789ABC'[i % 10], players: i % 3 ? 1 : 2, open: i % 3 === 1, ask: i % 3 === 2, bot: i % 3 === 2, watch: 8, watchers: i % 4, score: [i % 11, (i * 3) % 11], live: true, names: ['Player' + (i + 1), i % 3 === 2 ? 'Matt' : 'Guest' + i] }))); tab('open'); },
      'connect': () => { ui.setStatus({ airpod: 'wait', game: 'ok', camera: 'wait' }); ui.showScreen('connect'); },
      'calibrate1': () => cal({ stage: 'hold', progress: .62, ok: true, msg: 'Hold it like a paddle, pointed at the screen. Keep still.' }),
      'calibrate2': () => cal({ stage: 'tilt', progress: .4, ok: true, msg: 'Now tip the front of the AirPod up.' }),
      'calibrate-error': () => qs.get('err') === 'twist' ? cal({ stage: 'tilt', progress: 0, ok: false, msg: 'That was a twist. Level out, then tip it straight up.' }) : cal({ stage: 'hold', progress: 0, ok: false, msg: 'You moved. Hold still.' }),
      'calibrate-done': () => cal({ stage: 'tilt', progress: 1, ok: true, msg: 'All set' }),
      'calibrate-settle': () => cal({ stage: 'tilt', progress: .5, ok: true, msg: 'Good. Now hold it how you’ll play.' }),
      'hud': () => hud(),
      'hud-stats': () => { hud(); ui.toggle('dev'); ui.setStat('pw', '12.4'); ui.setStat('px', '0.8'); ui.setStat('py', '1.1'); ui.setStat('pkmax', '31.2'); ui.setStat('sw', 14); ui.setStat('pkavg', '19.6'); ui.setStat('pklist', '22 (96°) · × (31°) · 30 (128°) · 17 (74°) · 26 (110°)'); },
      'hud-countdown': () => { hud(0, 0, 0); ui.setServe(null); ui.countdown(+qs.get('left') || 3); },      // the count into a match: no score, no rally, nothing in play yet
      'hud-callout': () => { hud(7, 5, 5); ui.callout(qs.get('kind') || 'smash', qs.get('them') === '1'); },
      'hud-point-you': () => { hud(8, 5, 0); ui.pointBanner(true); },
      'hud-arrivals': () => { hud(0, 0, 0); ui.setServe(null); ui.setWatchers(2); ui.joinBanner(opp); ui.watcherNote('Sam'); ui.watcherNote('Priyanka'); },      // who just arrived: the centre banner for a player, the left cards for the stands
      'hud-point-enemy': () => { hud(7, 6, 0); ui.pointBanner(false); },
      'serve-prompt': () => { hud(7, 5, 0); ui.toast('Your serve!', 1e6); },
      'hud-airpod-lost': () => { hud(); ui.setStatus({ airpod: 'bad' }); ui.toast('AirPod signal lost', 1e6); },
      'settings': () => { hud(); ui.setSettings({ canPause: false }); ui.settings(true); },                                   // against a human: live behind it, the can't-pause note
      'settings-paused': () => { hud(); ui.setPaused(true); ui.settings(true); },                                              // against Matt: blurred, "Paused"
      'settings-stats': () => { hud(); ui.show('dev', true); ui.setSettings({ stats: true }); ui.setStat('pw', '12.4'); ui.setStat('pkmax', '31.2'); ui.setStat('pklist', '22 (96°) · × (31°) · 30 (128°) · 17 (74°) · 26 (110°)'); ui.settings(true); },      // the stats step out from under the card
      'settings-watch': () => { watch(); ui.settings(true); },
      'hud-paused': () => { watch(); ui.setPaused(true); },                                                                   // the tag a spectator sees
      'hold': () => { hud(); ui.setServe(null); ui.hold(opp, 12); },
      'watch': () => watch(), 'watch-split': () => watch('split'), 'watch-pov': () => watch('pov', opp),
      'watch-point': () => { watch(); ui.pointBanner(null, opp, 1); },
      'match-win': () => result({ won: true, me: 11, them: 8, stats: { rally: 14, smashes: 3, run: 5 } }, { mine: null, theirs: null, left: 20 }),
      'match-voted': () => result({ won: true, me: 11, them: 8 }, { mine: true, theirs: null, left: 14 }),
      'match-asked': () => result({ won: false, me: 9, them: 11 }, { mine: null, theirs: true, left: 17 }),
      'match-left': () => result({ won: true, me: 11, them: 8 }, { mine: true, theirs: false, left: 9 }),
      'match-lose': () => result({ won: false, me: 9, them: 11, stats: { rally: 7, smashes: 0, run: 4 } }, { left: 20 }),
      'match-forfeit': () => result({ won: true, me: 6, them: 4, forfeit: true }, { left: 20 }),
      'match-watch': () => { watch(); ui.matchResult({ won: false, me: 9, them: 11, nameMe: me, nameThem: opp, role: 'spectator', stats: { rally: 12, smashes: 4, run: 3 } }); ui.rematch({ left: 16 }); },
      'match-nostats': () => result({ won: true, me: 11, them: 8, stats: null }, { mine: null, theirs: null, left: 20 }),      // main.js did not see every point: no stats row
      'match-legacy': () => { hud(11, 8, 0); ui.setServe(null); ui.matchResult(true, 11, 8, opp); },                           // the old positional call: no vote
      'server-down': () => { hud(); ui.setStatus({ game: 'bad' }); ui.setServerAddress('ws://localhost:8080'); ui.showOverlay('server-down'); },
      'game-full': () => { hud(); ui.showOverlay('game-full'); },
      // asking to play: the player's corner card (over the court, over the paused settings card, over the result card), the spectator's button
      'hud-ask': () => { hud(); ui.askCard({ name: qs.get('asker') || 'Sam', left: 10 }); },
      'hud-ask-settings': () => { hud(); ui.setPaused(true); ui.settings(true); ui.askCard({ name: 'Sam', left: 7 }); },
      'match-ask': () => { result({ won: true, me: 11, them: 8 }, { mine: null, theirs: null, left: 20 }); ui.askCard({ name: 'Sam', left: 4 }); },
      'tourney-courts': () => { TOURS.push({ code: 'T8MX', host: 'Daniel', n: 5, max: 16 }); courts(); tab('open'); },
      'tourney-host-empty': () => tourLobby(tsnap(1), 'tour'),
      'tourney-host-3': () => tourLobby(tsnap(3, { off: qs.get('off') ? 2 : undefined }), 'tour'),
      'tourney-host-ready': () => tourLobby(tsnap(+qs.get('n') || 5), 'tour'),
      'tourney-host-16': () => tourLobby(tsnap(16), 'tour'),
      'tourney-guest': () => tourLobby(tsnap(+qs.get('n') || 5, { you: { id: 3, host: false, warm: 'off' } }), 'tour'),
      'tourney-warmfull': () => tourLobby(tsnap(3, { you: { id: 3, host: false, warm: 'full' } }), 'tour'),
      'tourney-banner': () => { warm(tsnap(+qs.get('n') || 5, { you: { id: 3, host: false, warm: 'on' } })); ui.tourNote('Priyanka'); },
      'tourney-banner-host': () => warm(tsnap(+qs.get('n') || 5, { you: { id: 1, host: true, warm: 'on' } })),
      'tourney-card': () => { warm(tsnap(+qs.get('n') || 5, { you: { id: 1, host: true, warm: 'on' } })); ui.setPaused(true); ui.tourCard(true); },
      'tourney-intro': () => { hud(0, 0, 0); ui.tourVs({ round: 2, name: qs.get('final') ? 'Final' : 'Quarterfinal', n: 2, of: qs.get('final') ? 1 : 4, vs: qs.get('bot') ? { name: 'Matt', bot: true } : { name: 'Kim', bot: false }, target: qs.get('final') ? 11 : 7, final: !!qs.get('final'), at: 4, side: 0 }); },
      'tourney-bracket': () => tourLobby(bracketSnap(+qs.get('n') === 16 ? 16 : 5, qs.get('you') || 'through', qs.get('next') === '1'), 'bracket'),
      'tourney-win': () => { hud(7, 4, 0); ui.setServe(null); ui.matchResult({ won: true, me: 7, them: 4, nameThem: 'Kim', stats: { rally: 10, smashes: 2, run: 4 }, tour: { round: 'Quarterfinal', next: 'Semifinal', final: false, gap: 6 } }); },
      'tourney-out': () => { hud(4, 7, 0); ui.setServe(null); ui.matchResult({ won: false, me: 4, them: 7, nameThem: 'Kim', stats: { rally: 8, smashes: 1, run: 3 }, tour: { round: 'Quarterfinal', next: 'Semifinal', final: false, gap: 6 } }); },
      'tourney-champion': () => { hud(11, 9, 0); ui.setServe(null); ui.champion(CHAMP, 1); },
      'tourney-champion-watch': () => { hud(11, 9, 0); ui.setServe(null); ui.champion(qs.get('matt') ? { ...CHAMP, id: null, name: 'Matt', bot: true } : CHAMP, 5); },
      'tourney-ended': () => { lobby(); ui.tourEnded(qs.get('why') || 'restart'); },
      'tourney-match': () => tmatch(),                                                                                        // in a match (4.6 item 7): the pill names the round and who, no court pill, no 1 2 3 4
      'tourney-match-settings': () => { tmatch(); ui.settings(true); },                                                         // Forfeit, and 'Tournament matches can't pause'
      'tourney-match-qq': () => { tmatch(); ui.toast('Press Q again to forfeit', 1e6); },
      'lobby-five': () => { lobby(); five(); },
      'lobby-ranked': () => rkLobby(), 'ranked': () => rkLobby(),
      'lobby-ranks': () => { rkLobby(); ui.lobbyView('ranks'); },      // every medal (the Ranks page), the player's own rank ringed
      'ranked-queue': () => { hud(2, 1, 0); document.body.dataset.venue = 'stadium'; ui.setBot(null); ui.setNames({ them: 'Matt', themSub: 'Club', rank: [{ tier: TIER, div: 2 }, null] }); ui.rkCourt('warm'); ui.setSettings({ rkWarm: true }); ui.rkPill({ on: true, since: performance.now() - 42000, queued: QN }); },      // the warm-up: Matt at your rank's level, the pill counting the wait
      'rk-search': () => { const over = qs.get('over') || 'ranked';      // queued, waiting in the lobby: the bar hangs from the top of the title and of every lobby view
        if (over === 'title') { $('stage').hidden = false; ui.showScreen('title'); } else { rkLobby(); if (over !== 'ranked') ui.lobbyView(over); if (over === 'courts') ui.lobbyRooms(ROOMS, 5, TOURS); }
        ui.rkBanner({ on: true, since: performance.now() - 42000, tier: TIER, div: 2, busy: qs.get('busy') === '1' }); },
      'ranked-hud': () => rkHud(),                                                                                                  // a series game: emblems beside both names (yours, theirs with a badge), no 1 2 3 4
      'ranked-emblems': () => { $('stage').hidden = false; ui.showScreen('lobby'); five(); ui.lobbyView('ranked'); ui.rkView({ tier: 7, div: 3, trophies: 1500, best: 7, queued: 0 }); },      // the road with every step lit
      'ranked-hud-pressure': () => { rkHud(6, 5, 3); ui.setPressure({ side: qs.get('side') === 'them' ? 'them' : 'me', kind: qs.get('kind') === 'match' ? 'match' : 'game' }); },      // GAME POINT / MATCH POINT: the ring on the score, the word in the lozenge
      'rk-vs': () => { hud(0, 0, 0); ui.setServe(null); document.body.dataset.venue = 'stadium'; ui.rkVs({ vs: { name: RKN, reg: true, tier: Math.min(7, TIER + 1), div: 1 }, you: { tier: TIER, div: 2 }, bestOf: 3, target: 7, friendly: qs.get('friendly') === '1', at: qs.get('ready') === '1' ? 1.5 : 5, side: 0 }); },      // MATCH FOUND; &ready=1 brings the Get ready bar forward
      'rk-game': () => { const lose = qs.get('beat') === 'lose', dec = qs.get('deciding') === '1', watch = qs.get('watch') === '1', games = dec ? [1, 1] : lose ? [0, 1] : [1, 0]; rkHud(lose ? 4 : 7, lose ? 7 : 4, 0, games); ui.setServe(null); if (watch) { ui.setSpectator(true); ui.setNames({ me: me || 'Daniel', meSub: '', reg: [true, true] }); }
        ui.rkGame({ won: !lose, watching: watch, nameMe: watch ? (me || 'Daniel') : 'You', nameThem: RKN, game: dec ? 2 : 1, bestOf: 3, games, score: lose ? [4, 7] : [7, 4], serve: lose ? 'me' : 'them', next: qs.get('next') != null ? +qs.get('next') : 6, deciding: dec }); },
      'match-rk-win': () => rkCard({ won: true, me: 7, them: 3, stats: { rally: 12, smashes: 2, run: 4 }, rk: { games: [2, 1], bestOf: 3, scores: [[7, 4], [5, 7], [7, 3]], done: true, gap: 12 } }, 'up'),
      'match-rk-lose': () => rkCard({ won: false, me: 4, them: 7, stats: { rally: 9, smashes: 1, run: 3 }, rk: { games: [1, 2], bestOf: 3, scores: [[7, 4], [5, 7], [4, 7]], done: true, gap: 12 } }, 'down'),
      'match-rk-forfeit': () => rkCard({ won: true, me: 3, them: 2, forfeit: true, rk: { games: [1, 0], bestOf: 3, scores: [[7, 4]], done: true, gap: 12 } }, 'walkover'),      // they left: 'Priyanka left', a walkover (&trophy=none: nothing counted)
      'match-rk-matt': () => { hud(qs.get('beat') === 'lose' ? 3 : 7, qs.get('beat') === 'lose' ? 7 : 3, 0); document.body.dataset.venue = 'stadium'; ui.setBot(null); ui.setServe(null); ui.setNames({ them: 'Matt', themSub: 'Club', rank: [{ tier: TIER, div: 2 }, null] }); ui.rkCourt('warm'); ui.setSettings({ rkWarm: true });
        ui.matchResult({ won: qs.get('beat') !== 'lose', me: qs.get('beat') === 'lose' ? 3 : 7, them: qs.get('beat') === 'lose' ? 7 : 3, nameThem: 'Matt', rank: [{ tier: TIER, div: 2 }, null], rk: { matt: true, next: 6 }, stats: { rally: 8, smashes: 1, run: 3 } }); ui.trophyRow(TROPHY[qs.get('trophy') || 'matt']); },      // the warm-up card: +8, Next game in 6, the pill stays behind it
      'watch-ask': () => { watch(); ui.setNames({ me: 'Lu', meSub: '', them: 'Matt', themSub: 'Club' }); ui.showAsk(true); const st = qs.get('s') || 'idle'; if (st !== 'idle') ui.askPlay({ s: st, left: st === 'sent' ? 9 : 8, busy: qs.get('busy') === '1' }); const why = st === 'no' ? 'Lu said no' : st === 'expired' ? 'No answer from Lu' : st === 'wait' && qs.get('busy') === '1' ? 'Someone else asked first' : ''; if (why) ui.toast(why, 600000); },      // main.js's toast says why
    };
    (R[screen] || R.title)();
    if (qs.get('idle') === '1') for (const id of ['keys', 'views']) $(id).classList.add('is-idle');
    document.title = 'ready ' + screen;
  }
</script>
