<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#dfeef6">
<title>Poddle: page not found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@font-face{font-family:"M PLUS Rounded 1c";font-weight:700;font-display:swap;src:url(/vendor/fonts/mplus-rounded-1c-700.woff2) format("woff2")}
html,body{height:100%;margin:0}
body{display:grid;place-content:center;justify-items:center;gap:1rem;padding:0 1rem;text-align:center;font:700 1.125rem/1.5 "M PLUS Rounded 1c",system-ui,sans-serif;color:#39434d;background:#dfeef6}
h1{margin:0;font-size:3rem;line-height:1.1}
p{margin:0}
a{color:#1a9fd0;text-decoration:underline transparent;text-underline-offset:.15em;transition:text-decoration-color .16s,text-underline-offset .16s}
a:hover,a:focus-visible{text-decoration-color:currentColor;text-underline-offset:.25em}
.btn{margin-top:.5rem;padding:.75rem 2rem;border-radius:999px;border:.125rem solid #1a9fd0;background:#34beed;color:#fff;transition:transform .16s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:translateY(2px) scale(.97)}
@media (hover:hover){.btn:hover{transform:translateY(-2px) scale(1.04) rotate(-1.5deg)}.btn:hover:active{transform:translateY(2px) scale(.97)}}
@media (prefers-reduced-motion:no-preference){h1{animation:oob .7s cubic-bezier(.34,1.56,.64,1) backwards}p,a{animation:up .45s cubic-bezier(.22,1,.36,1) .15s backwards}}
@keyframes oob{from{opacity:0;transform:translate(-3rem,-1rem) rotate(-8deg)}}
@keyframes up{from{opacity:0;transform:translateY(.5rem)}}
</style>
<h1>Out of bounds</h1>
<p>That page is not here.</p>
<a class="btn" href="/">Back to Poddle</a>
